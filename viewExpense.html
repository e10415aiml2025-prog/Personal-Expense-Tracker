
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Expense</title>
</head>
<body>

    <h2>View Expense</h2>

    <table class="Table" border="1">
        <caption class="tableCaptions">Expense Table: </caption>

        <thead>
            <tr>
                <th>Sr. No.</th>
                <th>Category</th>
                <th>Date</th>
                <th>Amount (₹)</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="expenseTable">
        </tbody>
    </table>

    <script>
        let expenses =
            JSON.parse(localStorage.getItem("expenses")) || [];

        let expenseTable = document.getElementById("expenseTable");

        expenses.forEach(function(expense, index) {
        let row = document.createElement("tr");

        row.innerHTML = `
            <td>${index + 1}</td>
            <td>${expense.category}</td>
            <td>${expense.date}</td>
            <td>₹${expense.amount}</td>
            <td>
                <button id="deleteButton" onclick="confirmDelete(${index})">
                    Delete
                </button>
            </td>
    `   ;

    expenseTable.appendChild(row);
});
        let total = expenses.reduce(function(sum, expense) {
    return sum + Number(expense.amount);
    }, 0);

    let totalRow = document.createElement("tr");

    totalRow.innerHTML = `
        <tdcolspan="3"><strong>Total Expense</strong></td>
        <td><strong>₹${total.toFixed(2)}</strong></td>
`   ;

    expenseTable.appendChild(totalRow);
        function deleteExpense(index) {
        let expenses = JSON.parse(
            localStorage.getItem("expenses")
        ) || [];

        expenses.splice(index, 1);

        localStorage.setItem(
            "expenses",
            JSON.stringify(expenses)
        );

        location.reload();
    }
        function confirmDelete(index) {
        let answer = confirm(
            "Are you sure you want to delete this expense?"
        );

        if (answer) {
            deleteExpense(index);
        }
    }
    </script>

</body>
</html>
